<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شكراً لتواصلك - بيت آرت للمقاولات والديكور</title>
    <!-- استيراد الخطوط وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ضع كود بيكسل تيك توك الأساسي هنا إذا أردت، أو اتركه -->
    
    <style>
        :root {
            --primary-color: #1b263b;
            --accent-color: #d4af37;
            --text-color: #333333;
            --bg-light: #f8f9fa;
            --white: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-light);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .thankyou-box {
            background: var(--white);
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            border-top: 5px solid var(--accent-color);
        }
        .thankyou-box i {
            font-size: 4rem;
            color: #25d366;
            margin-bottom: 20px;
        }
        .thankyou-box h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        .thankyou-box p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }
        .btn-wa {
            background-color: #25d366;
            color: white;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn-wa:hover {
            background-color: #1ebc57;
        }
    </style>
</head>
<body>

    <div class="thankyou-box">
        <i class="fas fa-check-circle"></i>
        <h1>شكراً لك! تم استلام طلبك بنجاح</h1>
        <p>يسعدنا انضمامك لعملاء <strong>بيت آرت للمقاولات والديكور بالرياض</strong>. سيتم تحويلك الآن لمتابعة طلبك والتنسيق الفوري معنا.</p>
        <a href="https://wa.me/966549699045?text=مرحباً، لقد سجلت في الموقع وأرغب في الاستفادة من العرض" class="btn-wa">
            <i class="fab fa-whatsapp"></i> تواصل معنا عبر واتساب الآن
        </a>
    </div>

</body>
</html>
